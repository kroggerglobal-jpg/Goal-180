
name: Build GOAL 180 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GOAL180-Android-Project.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q GOAL180-Android-Project.zip

      - name: Build APK
        run: gradle -p GOAL180-Android-Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOAL180-APK
          path: GOAL180-Android-Project/app/build/outputs/apk/debug/app-debug.apk
